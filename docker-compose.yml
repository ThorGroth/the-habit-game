services:
  backend:
    build:
      context: ./backend
    container_name: the-habit-game-backend
    ports:
      - "8000:8000"
    volumes: 
      - ./backend/dev.db:/app/dev.db
  frontend:
    build:
      context: ./frontend
    container_name: the-habit-game-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
